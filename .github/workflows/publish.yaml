# 极光幕 · Aurorama 发布流程（W72 起禁用自动触发）
#
# 背景：本文件原为上游 Findroid 的自动发布流水线（on: push tags v* + fastlane publish），
# 依赖上游 secrets（FINDROID_KEYSTORE / FINDROID_PLAY_API_CREDENTIALS）并会尝试发布 Google Play；
# 直接推 v1.0.0 tag 会失败且可能触发 Play 步骤，故 2026-10-05（W72）改为仅手动触发。
#
# 当前发布方式 = 手动（docs/RELEASE_PLAN.md §5）：
#   打 tag v1.0.0 → GitHub Draft a new release → 上传 Aurorama-1.0.0-universal.apk /
#   Aurorama-1.0.0-arm64-v8a.apk → 粘贴 docs/RELEASE_NOTES_v1.0.0.md 正文 → 发布后校验。
#
# CI 自动发布（构建 → 签名 → 建 Release → 上传 APK）后续按需重建，见 docs/RELEASE_PLAN.md §9；
# 重建前请勿手动触发本工作流——它只打印说明，不执行任何发布动作。
name: Publish (disabled)

on:
  workflow_dispatch:

jobs:
  disabled:
    name: Publish disabled — see docs/RELEASE_PLAN.md
    runs-on: ubuntu-24.04
    steps:
      - name: Notice
        run: |
          echo "CI 自动发布已禁用（W72，2026-10-05）。"
          echo "当前 1.0.0 手动发布步骤见 docs/RELEASE_PLAN.md §5；"
          echo "Release notes 正文见 docs/RELEASE_NOTES_v1.0.0.md；CI 发布后续按需重建（§9）。"
