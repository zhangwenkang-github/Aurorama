<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">权限与不可用状态</title>
<desc id="desc">下载 403、管理员门控、动态色平台限制和 SyncPlay 候选的状态区分。</desc>
<rect width="1600" height="900" fill="#090C11"/>
<text x="48.00" y="42.00" fill="#9FCDBB" fill-opacity="1" font-family="'MiSans','Microsoft YaHei UI',sans-serif" font-size="15" font-weight="700" text-anchor="start" letter-spacing="1.1">G1-S5 · 状态 3/3 · 权限</text>
<text x="48.00" y="78.00" fill="#F3F5F7" fill-opacity="1" font-family="'MiSans','Microsoft YaHei UI',sans-serif" font-size="34" font-weight="700" text-anchor="start" letter-spacing="0">权限 / 不可用边界</text>
<text x="48.00" y="106.00" fill="#AAB4C0" fill-opacity="1" font-family="'MiSans','Microsoft YaHei UI',sans-serif" font-size="16" font-weight="400" text-anchor="start" letter-spacing="0">权限拒绝不自动重试；不可用、离线、空与错误必须分开。</text>
<text x="1552.00" y="46.00" fill="#AAB4C0" fill-opacity="1" font-family="'MiSans','Microsoft YaHei UI',sans-serif" font-size="14" font-weight="500" text-anchor="end" letter-spacing="0">STATIC · RUNTIME UNVERIFIED</text>
<rect x="48.00" y="154.00" width="362.00" height="620.00" rx="18.00" fill="#111720" fill-opacity="1" stroke="#303B48" stroke-width="1"/>
<circle cx="82.00" cy="196.00" r="14.00" fill="#E87C6E" fill-opacity="0.22" stroke="#E87C6E" stroke-width="2"/>
<text x="110.00" y="202.00" fill="#F3F5F7" fill-opacity="1" font-family="'MiSans','Microsoft YaHei UI',sans-serif" font-size="20" font-weight="700" text-anchor="start" letter-spacing="0">下载 403</text>
<text x="74.00" y="250.00" fill="#AAB4C0" fill-opacity="1" font-family="'MiSans','Microsoft YaHei UI',sans-serif" font-size="15" font-weight="700" text-anchor="start" letter-spacing="0">对象：潮汐档案</text>
<rect x="74.00" y="274.00" width="310.00" height="130.00" rx="14.00" fill="#1B212B" fill-opacity="1" stroke="#667383" stroke-width="1"/>
<text x="94.00" y="310.00" fill="#E87C6E" fill-opacity="1" font-family="'MiSans','Microsoft YaHei UI',sans-serif" font-size="13" font-weight="700" text-anchor="start" letter-spacing="0">状态</text>
<text x="94.00" y="342.00" fill="#F4F1EA" fill-opacity="1" font-family="'MiSans','Microsoft YaHei UI',sans-serif" font-size="17" font-weight="500" text-anchor="start" letter-spacing="0">来源拒绝访问；无自动重试。</text>
<text x="74.00" y="454.00" fill="#A7B0BD" fill-opacity="1" font-family="'MiSans','Microsoft YaHei UI',sans-serif" font-size="13" font-weight="700" text-anchor="start" letter-spacing="0">恢复路径</text>
<text x="74.00" y="484.00" fill="#F3F5F7" fill-opacity="1" font-family="'MiSans','Microsoft YaHei UI',sans-serif" font-size="15" font-weight="400" text-anchor="start" letter-spacing="0">返回详情；权限变化后由用户重新发起。</text>
