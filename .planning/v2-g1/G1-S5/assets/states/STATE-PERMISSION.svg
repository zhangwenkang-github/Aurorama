<rect x="1194.00" y="154.00" width="362.00" height="620.00" rx="18.00" fill="#111720" fill-opacity="1" stroke="#303B48" stroke-width="1"/>
<circle cx="1228.00" cy="196.00" r="14.00" fill="#72AEF5" fill-opacity="0.22" stroke="#72AEF5" stroke-width="2"/>
