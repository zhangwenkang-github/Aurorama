<text x="476.00" y="342.00" fill="#F4F1EA" fill-opacity="1" font-family="'MiSans','Microsoft YaHei UI',sans-serif" font-size="17" font-weight="500" text-anchor="start" letter-spacing="0">当前账户无管理能力。</text>
<text x="456.00" y="454.00" fill="#A7B0BD" fill-opacity="1" font-family="'MiSans','Microsoft YaHei UI',sans-serif" font-size="13" font-weight="700" text-anchor="start" letter-spacing="0">恢复路径</text>
<text x="456.00" y="484.00" fill="#F3F5F7" fill-opacity="1" font-family="'MiSans','Microsoft YaHei UI',sans-serif" font-size="15" font-weight="400" text-anchor="start" letter-spacing="0">显示可见原因；普通浏览入口仍可用。</text>
