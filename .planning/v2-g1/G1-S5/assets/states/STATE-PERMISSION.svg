<text x="838.00" y="250.00" fill="#AAB4C0" fill-opacity="1" font-family="'MiSans','Microsoft YaHei UI',sans-serif" font-size="15" font-weight="700" text-anchor="start" letter-spacing="0">Android 12 以下</text>
<rect x="838.00" y="274.00" width="310.00" height="130.00" rx="14.00" fill="#1B212B" fill-opacity="1" stroke="#667383" stroke-width="1"/>
<text x="858.00" y="310.00" fill="#E4B962" fill-opacity="1" font-family="'MiSans','Microsoft YaHei UI',sans-serif" font-size="13" font-weight="700" text-anchor="start" letter-spacing="0">状态</text>
<text x="858.00" y="342.00" fill="#F4F1EA" fill-opacity="1" font-family="'MiSans','Microsoft YaHei UI',sans-serif" font-size="17" font-weight="500" text-anchor="start" letter-spacing="0">主题入口禁用，不伪装成可点预览。</text>
