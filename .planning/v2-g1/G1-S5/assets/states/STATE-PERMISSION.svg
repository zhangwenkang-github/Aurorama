<text x="1220.00" y="250.00" fill="#AAB4C0" fill-opacity="1" font-family="'MiSans','Microsoft YaHei UI',sans-serif" font-size="15" font-weight="700" text-anchor="start" letter-spacing="0">能力未通过 G1/G2</text>
<rect x="1220.00" y="274.00" width="310.00" height="130.00" rx="14.00" fill="#1B212B" fill-opacity="1" stroke="#667383" stroke-width="1"/>
