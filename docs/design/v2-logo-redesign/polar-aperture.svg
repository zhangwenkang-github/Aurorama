<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Aurorama 极向光瞳 Logo</title>
  <desc id="desc">深色圆角方形内，一道接近闭合的极光椭圆环在四点钟方向接入单片六边切面玻璃；玻璃片带横向凹槽，以明确的切面而非箭头提示折射。</desc>
