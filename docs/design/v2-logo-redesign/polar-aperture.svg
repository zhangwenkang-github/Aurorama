      <stop offset=".48" stop-color="#63E2E8"/>
      <stop offset="1" stop-color="#72A9FF"/>
    </linearGradient>
    <linearGradient id="glassA" x1="304" y1="306" x2="398" y2="426" gradientUnits="userSpaceOnUse">
