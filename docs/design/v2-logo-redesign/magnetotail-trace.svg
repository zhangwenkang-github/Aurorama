      <stop stop-color="#11161D"/>
      <stop offset=".55" stop-color="#090C12"/>
      <stop offset="1" stop-color="#14111A"/>
    </linearGradient>
    <linearGradient id="tailC" x1="149" y1="346" x2="429" y2="172" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6FFBD9"/>
      <stop offset=".48" stop-color="#66D7F1"/>
      <stop offset="1" stop-color="#8B9CFF"/>
    </linearGradient>
    <linearGradient id="glassC" x1="153" y1="290" x2="218" y2="382" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FDFF" stop-opacity=".9"/>
      <stop offset=".58" stop-color="#79E1DF" stop-opacity=".34"/>
      <stop offset="1" stop-color="#294B64" stop-opacity=".7"/>
    </linearGradient>
    <clipPath id="tileClipC">
      <rect x="24" y="24" width="464" height="464" rx="116"/>
    </clipPath>
  </defs>
  <g clip-path="url(#tileClipC)">
