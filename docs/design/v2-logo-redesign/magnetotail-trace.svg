      stroke="#DFF5FF" stroke-width="20" stroke-linecap="round" opacity=".9"/>
    <path d="M150 278 226 329 181 399 114 351 128 307Z" fill="url(#glassC)"
      stroke="#F5FDFF" stroke-width="13" stroke-linejoin="round"/>
    <path d="M135 338 205 357" fill="none" stroke="#07131A" stroke-width="13"
      stroke-linecap="round"/>
    <path d="M151 304 190 351" fill="none" stroke="#FFFFFF" stroke-opacity=".7"
